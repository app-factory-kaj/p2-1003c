openapi: 3.0.3
info:
  title: Greeter API
  version: 0.1.0
servers:
  - url: /
paths:
  /hello:
    get:
      operationId: getGreeting
      summary: Return a JSON greeting for the given name, or a default greeting when name is omitted
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Name to greet
      responses:
        '200':
          description: Greeting returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Greeting'
components:
  schemas:
    Greeting:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: 'The greeting text, e.g. "Hello, Ada!" or "Hello, World!"'
